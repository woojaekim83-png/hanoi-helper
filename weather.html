<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>하노이 주간 날씨</title>
  <meta name="theme-color" content="#1c64d9">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --sky: #1c64d9; --sky-deep: #134aa8; --accent: #0a6cff; --canvas: #fff; --page: #eef1f5;
      --ink: #1f1f1f; --slate: #5d5b54; --steel: #787774; --hairline: #e6e6e6;
      --hot: #e8590c; --cold: #1c64d9; --rain: #1971c2;
      --font: Inter, -apple-system, system-ui, 'Segoe UI', 'Malgun Gothic', Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--font); word-break: keep-all; }
    .wrap { max-width: 560px; margin: 0 auto; padding-bottom: 32px; }
    header { background: linear-gradient(135deg, var(--sky), var(--sky-deep)); color: #fff; padding: 20px 20px 24px; }
    header .top { display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header a { color: #fff; font-size: 13px; text-decoration: none; opacity: .9; }
    .now { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
    .now .ic { font-size: 56px; line-height: 1; }
    .now .t { font-size: 48px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .now .d { font-size: 14px; opacity: .95; }
    .tip { margin: 14px 0 0; padding: 10px 12px; background: rgba(255,255,255,.16); border-radius: 10px; font-size: 13px; }
    main { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .day {
      display: grid; grid-template-columns: 64px 36px 1fr auto; align-items: center; gap: 10px;
      background: var(--canvas); border-radius: 12px; padding: 12px 14px; box-shadow: rgba(15,15,15,.04) 0 1px 2px;
    }
    .day.today { outline: 2px solid var(--accent); }
    .day .w { font-weight: 700; }
    .day .w small { display: block; font-weight: 400; font-size: 12px; color: var(--steel); }
    .day .ic { font-size: 28px; text-align: center; }
    .day .desc { font-size: 14px; }
    .day .desc small { display: block; font-size: 12px; color: var(--rain); }
    .day .temp { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .day .temp b { color: var(--hot); font-size: 17px; }
    .day .temp span { color: var(--cold); margin-left: 6px; }
    .meta { font-size: 12px; color: var(--steel); text-align: center; margin-top: 6px; }
    .err { text-align: center; color: var(--steel); padding: 40px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top">
        <h1 id="wx-title">🇻🇳 하노이 주간 날씨</h1>
        <a href="./" id="back" data-tab="">← 도우미로</a>
      </div>
      <div class="now" id="now"></div>
      <p class="tip" id="tip" hidden></p>
    </header>
    <main id="days"><div class="err">날씨 불러오는 중…</div></main>
    <p class="meta" id="wx-meta">자료: Open-Meteo 기상 예보 · 매시간 갱신</p>
  </div>

  <script>
    // 날씨 코드 → 아이콘·한글 설명
    const W = [
      [0, '☀️', '맑음'], [1, '🌤️', '대체로 맑음'], [2, '⛅', '구름 조금'], [3, '☁️', '흐림'],
      [48, '🌫️', '안개'], [57, '🌦️', '이슬비'], [65, '🌧️', '비'], [67, '🌧️', '어는 비'],
      [77, '🌨️', '눈'], [82, '🌧️', '소나기'], [86, '🌨️', '눈 소나기'], [99, '⛈️', '뇌우'],
    ];
    const look = (c) => W.find(([max]) => c <= max) || W[0];
    const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
    // 앱에서 넘겨준 지역 (없으면 하노이) — 숫자만 받아 안전하게 사용
    const QS = new URLSearchParams(location.search);
    const num = (v, d, lo, hi) => { const n = parseFloat(v); return isFinite(n) && n >= lo && n <= hi ? n : d; };
    const LAT = num(QS.get('lat'), 21.03, 8, 24), LON = num(QS.get('lon'), 105.85, 102, 110);
    const PLACE = (QS.get('name') || '하노이').slice(0, 20);
    document.title = PLACE + ' 주간 날씨';
    document.getElementById('wx-title').textContent = '🇻🇳 ' + PLACE + ' 주간 날씨';

    // 4초 안에 답이 없으면 끊음 (베트남 휴대폰 네트워크에서 날씨 서버 연결이 자주 멈춰서)
    async function getJson(url) {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
      try { const r = await fetch(url, { signal: ctl.signal }); return r.ok ? await r.json() : null; }
      catch { return null; } finally { clearTimeout(t); }
    }
    async function load() {
      // ① 우리 사이트의 weather.json (GitHub가 30분마다 모아 둠) → 바로 표시
      const key = `${LAT.toFixed(2)},${LON.toFixed(2)}`;
      let shown = false;
      const site = await getJson('weather.json?t=' + Math.floor(Date.now() / 600000));
      const sp = site && site.places && site.places[key];
      if (sp && sp.current && sp.daily) {
        render(sp, sp.pm);
        document.getElementById('wx-meta').textContent = `자료: Open-Meteo 기상 예보 · ${site.updatedAt} 기준 (최신 값 확인 중…)`;
        shown = true;
      }
      // ② 날씨 서버에서 최신 값 (실패하면 ①을 그대로 둠)
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&timezone=Asia%2FHo_Chi_Minh&forecast_days=7`
        + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'
        + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max';
      const [live, air] = await Promise.all([getJson(url),
        getJson(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm2_5&timezone=Asia%2FHo_Chi_Minh`)]);
      if (live && live.current) {
        render(live, air && air.current ? air.current.pm2_5 : sp && sp.pm);
        document.getElementById('wx-meta').textContent = '자료: Open-Meteo 기상 예보 · 지금 기준';
      } else if (shown) {
        document.getElementById('wx-meta').textContent = `자료: Open-Meteo 기상 예보 · ${site.updatedAt} 기준`;
      } else {
        document.getElementById('days').innerHTML = '<div class="err">날씨를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</div>';
      }
    }
    function render(j, pm) {
      try {
        const c = j.current, d = j.daily;
        const [, ic, tx] = look(c.weather_code);
        document.getElementById('now').innerHTML =
          `<span class="ic">${ic}</span><div><div class="t">${Math.round(c.temperature_2m)}°</div>
           <div class="d">${tx} · 체감 ${Math.round(c.apparent_temperature)}° · 습도 ${c.relative_humidity_2m}% · 바람 ${Math.round(c.wind_speed_10m)}km/h</div></div>`;

        document.getElementById('days').innerHTML = d.time.map((t, i) => {
          const date = new Date(t + 'T00:00');
          const [, dic, dtx] = look(d.weather_code[i]);
          const p = d.precipitation_probability_max[i];
          const rain = p >= 20 ? `강수확률 ${p}%${d.precipitation_sum[i] >= 1 ? ` · ${Math.round(d.precipitation_sum[i])}mm` : ''}` : '';
          const label = i === 0 ? '오늘' : i === 1 ? '내일' : WEEK[date.getDay()] + '요일';
          return `<div class="day ${i === 0 ? 'today' : ''}">
            <div class="w">${label}<small>${date.getMonth() + 1}/${date.getDate()}</small></div>
            <div class="ic">${dic}</div>
            <div class="desc">${dtx}${rain ? `<small>☔ ${rain}</small>` : ''}</div>
            <div class="temp"><b>${Math.round(d.temperature_2m_max[i])}°</b><span>${Math.round(d.temperature_2m_min[i])}°</span></div>
          </div>`;
        }).join('');

        // 오늘·내일 생활 팁
        const tips = [];
        // 미세먼지 (PM2.5, 5단계)
        if (pm != null) {
          const lv = [[8, '아주좋음', '😄'], [15, '좋음', '🙂'], [35, '보통', '😐'], [75, '나쁨', '😷'], [Infinity, '아주나쁨', '🤢']].find(([m]) => pm <= m);
          document.querySelector('#now .d').insertAdjacentHTML('beforeend', `<br>${lv[2]} 미세먼지 <b>${lv[1]}</b> (PM2.5 ${Math.round(pm)}㎍/㎥)`);
          if (pm > 35) tips.push('😷 미세먼지가 나빠요. 마스크를 챙기고 창문을 닫아 두세요.');
        }
        if (Math.max(d.precipitation_probability_max[0], d.precipitation_probability_max[1]) >= 60) tips.push('☔ 오늘·내일 비 소식이 있어요. 우산을 챙기세요.');
        if (d.temperature_2m_max[0] >= 33) tips.push('🥵 낮 기온이 높아요. 물을 자주 마시세요.');
        if (d.temperature_2m_min[0] <= 15) tips.push('🧥 아침저녁 쌀쌀해요. 겉옷을 챙기세요.');
        if (d.uv_index_max[0] >= 8) tips.push('🧴 자외선이 매우 강해요.');
        const el = document.getElementById('tip'); el.textContent = tips.join(' '); el.hidden = !tips.length;
      } catch { /* 자료 형식이 다르면 건너뜀 */ }
    }
    load();
  </script>
  <script src="back.js"></script>
</body>
</html>
