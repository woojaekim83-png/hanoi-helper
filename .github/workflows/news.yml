# 뉴스 자동 수집: 3시간마다 scripts/fetch_news.py를 실행해 news.json을 갱신합니다.
# GitHub 저장소의 Actions 탭에서 "Run workflow"로 바로 실행할 수도 있어요.
name: 뉴스 수집

on:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다 (UTC 기준)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 뉴스 모으기
        run: python scripts/fetch_news.py
      - name: 바뀐 내용 올리기
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push
