# 자동 수집: 30분마다 뉴스·시세·날씨를 모아 news.json / market.json / weather.json을 갱신합니다.
# GitHub 저장소의 Actions 탭에서 "Run workflow"로 바로 실행할 수도 있어요.
# (GitHub 사정에 따라 실제 실행이 몇 분~수십 분 늦어질 수 있어요)
name: 뉴스 수집

on:
  schedule:
    - cron: '*/30 * * * *'      # 매시 00분, 30분 (30분 간격)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 뉴스 모으기
        run: python scripts/fetch_news.py
      - name: 오늘의 시세 모으기 (우리은행 환율, Petrolimex 유가)
        run: python scripts/fetch_market.py
      - name: 날씨·미세먼지 모으기 (지점·도시 전체)
        run: python scripts/fetch_weather.py || echo "날씨 수집 실패 — 기존 값 유지"
      - name: 바뀐 내용 올리기
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json market.json weather.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          # 같은 시간에 다른 수정이 올라와도 충돌하지 않게: 최신 내용을 받아 합친 뒤 올리기 (최대 3번 재시도)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
