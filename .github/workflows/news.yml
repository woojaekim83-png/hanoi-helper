# 뉴스 자동 수집: 1시간 반마다 scripts/fetch_news.py를 실행해 news.json을 갱신합니다.
# GitHub 저장소의 Actions 탭에서 "Run workflow"로 바로 실행할 수도 있어요.
# (GitHub 사정에 따라 실제 실행이 몇 분~수십 분 늦어질 수 있어요)
name: 뉴스 수집

on:
  schedule:
    - cron: '0 0-23/3 * * *'    # 00:00, 03:00, 06:00 ... (UTC)
    - cron: '30 1-23/3 * * *'   # 01:30, 04:30, 07:30 ... → 합치면 1시간 반 간격
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 뉴스 모으기
        run: python scripts/fetch_news.py
      - name: 오늘의 시세 모으기 (우리은행 환율, Petrolimex 유가)
        run: python scripts/fetch_market.py
      - name: 바뀐 내용 올리기
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json market.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push
