# 베트남 기준금리 수집: 매일 베트남 시각 09:00 (= UTC 02:00)에 SBV 공식 홈페이지에서 읽어 policy.json 갱신
# Actions 탭에서 "Run workflow"로 바로 실행할 수도 있어요. (GitHub 사정에 따라 몇 분~수십 분 늦을 수 있어요)
name: 기준금리 수집

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news          # 뉴스 수집과 동시에 올리지 않도록 같은 그룹
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 기준금리 읽기
        run: python scripts/fetch_policy.py
      - name: 바뀐 내용 올리기
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "기준금리 확인 $(TZ=Asia/Ho_Chi_Minh date '+%m/%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
