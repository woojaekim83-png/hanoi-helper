# 베트남 출발 최저가 항공권 수집 (Travelpayouts 가격 API → flights.json)
# 하루 3번(베트남 시간 06:40 · 12:40 · 18:40) 자동 실행. Actions 탭에서 "Run workflow"로 바로 실행할 수도 있어요.
name: 항공권 수집

on:
  schedule:
    - cron: '40 23,5,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news          # 다른 수집과 동시에 올리지 않도록 같은 그룹
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 항공권 가격 받기
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scripts/fetch_flights.py
      - name: 바뀐 내용 올리기
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flights.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "항공권 갱신 $(TZ=Asia/Ho_Chi_Minh date '+%m/%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
