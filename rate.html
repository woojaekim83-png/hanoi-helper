<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>환율 그래프</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --canvas: #fff; --page: #eef1f5; --surface: #f6f5f4; --hairline: #e6e6e6;
      --ink: #1f1f1f; --slate: #5d5b54; --steel: #787774; --muted: #a4a097;
      --up: #e03131; --down: #1c64d9; --flat: #787774;
      --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
      --font: Inter, -apple-system, system-ui, 'Segoe UI', 'Malgun Gothic', Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--font); word-break: keep-all; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 32px; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; }
    .top a { color: var(--slate); font-size: 14px; text-decoration: none; padding: 6px 0; }
    .card { background: var(--canvas); border-radius: var(--r-lg); margin: 12px 16px 0; padding: 18px 18px 16px; box-shadow: rgba(15,15,15,.04) 0 1px 2px; }
    .name { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
    .unit { color: var(--steel); font-size: 14px; margin-top: 2px; }
    hr { border: 0; border-top: 1px solid var(--hairline); margin: 14px 0; }
    .now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .now b { font-size: 38px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .now span { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
    .periods { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 16px 0 10px; }
    .periods button {
      border: 1px solid var(--hairline); background: var(--canvas); color: var(--slate); white-space: nowrap;
      font: 500 13px/1 var(--font); padding: 9px 0; border-radius: var(--r-full); cursor: pointer; letter-spacing: -.3px;
    }
    .periods button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .chart { position: relative; margin: 6px -4px 0; touch-action: pan-y; user-select: none; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart text { font: 500 11px var(--font); }
    .tip {
      position: absolute; top: 0; transform: translateX(-50%); pointer-events: none; white-space: nowrap;
      background: var(--ink); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; font-variant-numeric: tabular-nums;
    }
    .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--steel); font-size: 12.5px; margin-top: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; }
    .grid div { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; color: var(--slate); }
    .grid b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .vary { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: var(--r-lg); padding: 14px 0; }
    .vary div { padding: 0 10px; font-size: 12.5px; color: var(--slate); white-space: nowrap; letter-spacing: -.3px; }
    .vary div + div { border-left: 1px solid var(--hairline); }
    .vary b { display: block; margin-top: 4px; font-size: 16px; font-variant-numeric: tabular-nums; }
    .sub { margin-top: 12px; }
    .err { text-align: center; color: var(--steel); padding: 40px 0; }
    .note { color: var(--steel); font-size: 12px; text-align: center; margin: 14px 16px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="./" id="back" data-tab="market">← 오늘의 시세</a>
    </div>
    <div class="card" id="card"><div class="err">환율 기록 불러오는 중…</div></div>
    <p class="note">자료: 우리은행 고시환율 (매매기준율 · 원화 기준) · 30분마다 갱신<br>실제 거래 환율은 우대율·수수료에 따라 다를 수 있어요</p>
  </div>
  <script src="back.js?v=60"></script>
  <script>
    const CUR = {
      USD: { flag: '🇺🇸', name: '미국 달러', unit: 'USD 1' },
      VND: { flag: '🇻🇳', name: '베트남 동', unit: 'VND 100' },
      EUR: { flag: '🇪🇺', name: '유로', unit: 'EUR 1' },
      CNY: { flag: '🇨🇳', name: '중국 위안', unit: 'CNY 1' },
      JPY: { flag: '🇯🇵', name: '일본 엔', unit: 'JPY 100' },
    };
    const PERIODS = [['1개월', 1], ['3개월', 3], ['1년', 12], ['3년', 36], ['5년', 60], ['10년', 120]];
    const qs = new URLSearchParams(location.search).get('c');
    const CODE = CUR[qs] ? qs : 'VND';
    const C = CUR[CODE];
    document.title = `${C.name} 환율`;
    let rows = [], months = 3, info = {};

    const f2 = (v) => v == null ? '-' : v.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const ymd = (s) => new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
    const dot = (s) => `${s.slice(0, 4)}.${s.slice(4, 6)}.${s.slice(6, 8)}`;
    const cls = (v) => (Math.abs(v) < 1e-9 ? 'flat' : v > 0 ? 'up' : 'down');
    const arrow = (v) => (Math.abs(v) < 1e-9 ? '' : v > 0 ? '▲' : '▼');
    // n개월 전(그날 또는 그 전 마지막 영업일)의 기록
    function rowBefore(m) {
      const t = new Date(ymd(rows[rows.length - 1][0])); t.setMonth(t.getMonth() - m);
      for (let i = rows.length - 1; i >= 0; i--) if (ymd(rows[i][0]) <= t) return rows[i];
      return null;
    }
    function pct(m) {
      const p = rowBefore(m), last = rows[rows.length - 1];
      if (!p) return '<b class="flat">-</b>';
      const v = (last[1] - p[1]) / p[1] * 100;
      return `<b class="${cls(v)}">${arrow(v)}${Math.abs(v).toFixed(2)}%</b>`;
    }

    function render() {
      const last = rows[rows.length - 1], prev = rows[rows.length - 2] || last;
      const d = last[1] - prev[1], dp = prev[1] ? d / prev[1] * 100 : 0;
      document.getElementById('card').innerHTML = `
        <div class="name"><span>${C.flag}</span>${C.name}</div>
        <div class="unit">${C.unit}</div>
        <hr>
        <div class="now"><b>${f2(last[1])}</b><span class="${cls(d)}">${arrow(d)}${f2(Math.abs(d))} (${d > 0 ? '+' : d < 0 ? '-' : ''}${Math.abs(dp).toFixed(2)}%)</span></div>
        <div class="periods" role="group" aria-label="기간">${PERIODS.map(([l, m]) =>
          `<button type="button" data-m="${m}" aria-pressed="${m === months}">${l}</button>`).join('')}</div>
        <div class="chart" id="chart"></div>
        <div class="meta"><span>${info.noticed || dot(last[0])} 기준</span><span>우리은행 고시</span></div>
        <hr>
        <div class="grid">
          <div>현찰 살 때<b>${f2(last[4])}</b></div><div>송금 보낼 때<b>${f2(last[2])}</b></div>
          <div>현찰 팔 때<b>${f2(last[5])}</b></div><div>송금 받을 때<b>${f2(last[3])}</b></div>
        </div>
        <div class="vary sub">
          <div>1개월 변동률${pct(1)}</div><div>3개월 변동률${pct(3)}</div><div>1년 변동률${pct(12)}</div>
        </div>`;
      document.querySelector('.periods').addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        months = +b.dataset.m;
        document.querySelectorAll('.periods button').forEach((x) => x.setAttribute('aria-pressed', x === b));
        drawChart();
      });
      drawChart();
    }

    function drawChart() {
      const from = rowBefore(months);
      const data = rows.filter((r) => !from || r[0] >= from[0]);
      // 실제 화면 폭으로 그려서 글씨가 작아지지 않게
      const W = Math.max(280, Math.round(document.getElementById('chart').clientWidth || 340)), H = 210;
      const top = 24, bottom = 26, left = 4, right = 4;
      const vals = data.map((r) => r[1]);
      let lo = Math.min(...vals), hi = Math.max(...vals);
      const pad = (hi - lo) * 0.12 || hi * 0.01;
      const y0 = lo - pad, y1 = hi + pad;
      const X = (i) => left + (data.length === 1 ? 0.5 : i / (data.length - 1)) * (W - left - right);
      const Y = (v) => top + (1 - (v - y0) / (y1 - y0)) * (H - top - bottom);
      const trend = data[data.length - 1][1] - data[0][1];
      const col = trend > 0 ? 'var(--up)' : trend < 0 ? 'var(--down)' : 'var(--flat)';
      const line = data.map((r, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(r[1]).toFixed(1)}`).join('');
      const area = `${line}L${X(data.length - 1).toFixed(1)},${H - bottom}L${X(0).toFixed(1)},${H - bottom}Z`;
      const iHi = vals.indexOf(hi), iLo = vals.lastIndexOf(lo);
      // 날짜 눈금 4개
      const ticks = [0, 1, 2, 3].map((k) => Math.round(k * (data.length - 1) / 3));
      const tickLabel = (s) => months > 12 ? `${s.slice(2, 4)}.${s.slice(4, 6)}.` : `${s.slice(4, 6)}.${s.slice(6, 8)}.`;
      const anchor = (x) => (x < W * 0.15 ? 'start' : x > W * 0.85 ? 'end' : 'middle');
      const mark = (i, v, label, above) => {
        const x = X(i), y = Y(v);
        return `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="${col}" stroke-width="1.5"/>
          <text x="${x}" y="${above ? y - 8 : y + 16}" text-anchor="${anchor(x)}" fill="${col}">${label} ${f2(v)}</text>`;
      };
      document.getElementById('chart').innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${C.name} 환율 그래프">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
          </linearGradient></defs>
          ${ticks.slice(1, 3).map((i) => `<line x1="${X(i)}" x2="${X(i)}" y1="${top - 6}" y2="${H - bottom}" stroke="#e6e6e6"/>`).join('')}
          <line x1="${left}" x2="${W - right}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="#c9c7c2" stroke-dasharray="3 4"/>
          <line x1="${left}" x2="${W - right}" y1="${H - bottom}" y2="${H - bottom}" stroke="#e6e6e6"/>
          <path d="${area}" fill="url(#g)"/>
          <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${mark(iHi, hi, '최고', true)}${iLo !== iHi ? mark(iLo, lo, '최저', false) : ''}
          ${ticks.map((i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="${anchor(X(i))}" fill="#787774">${tickLabel(data[i][0])}</text>`).join('')}
          <line id="cross" x1="0" x2="0" y1="${top - 6}" y2="${H - bottom}" stroke="#1f1f1f" stroke-width="1" visibility="hidden"/>
          <circle id="hot" r="4.5" fill="${col}" stroke="#fff" stroke-width="2" visibility="hidden"/>
        </svg><div class="tip" id="tip" hidden></div>`;
      // 그래프를 누르거나 문지르면 그날 환율 표시
      const box = document.getElementById('chart'), svg = box.querySelector('svg');
      const cross = svg.getElementById('cross'), hot = svg.getElementById('hot'), tip = document.getElementById('tip');
      const show = (e) => {
        const r = svg.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width * W;
        const i = Math.max(0, Math.min(data.length - 1, Math.round((x - left) / (W - left - right) * (data.length - 1))));
        const px = X(i), py = Y(data[i][1]);
        cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
        hot.setAttribute('cx', px); hot.setAttribute('cy', py); hot.setAttribute('visibility', 'visible');
        tip.hidden = false; tip.textContent = `${dot(data[i][0])}  ${f2(data[i][1])}`;
        const sx = px / W * r.width, tw = tip.offsetWidth;
        tip.style.left = Math.max(tw / 2, Math.min(r.width - tw / 2, sx)) + 'px';
        tip.style.top = '-30px';
      };
      const hide = () => { cross.setAttribute('visibility', 'hidden'); hot.setAttribute('visibility', 'hidden'); tip.hidden = true; };
      box.onpointerdown = (e) => { show(e); box.setPointerCapture?.(e.pointerId); };
      box.onpointermove = (e) => { if (e.pointerType === 'mouse' || e.buttons) show(e); };
      box.onpointerup = box.onpointercancel = () => setTimeout(hide, 1200);
      box.onpointerleave = (e) => { if (e.pointerType === 'mouse') hide(); };
    }

    async function load() {
      try {
        const t = Math.floor(Date.now() / 600000);
        const [h, m] = await Promise.all([
          fetch(`history/${CODE}.json?t=${t}`, { cache: 'no-cache' }).then((r) => r.json()),
          fetch(`market.json?t=${t}`, { cache: 'no-cache' }).then((r) => r.json()).catch(() => null),
        ]);
        rows = (h.rows || []).filter((r) => r[1] != null);
        if (rows.length < 2) throw new Error('no rows');
        // 오늘 고시 시각 (시세 화면과 같은 값)
        const nt = m && m.rates && m.rates.noticedAt;
        if (nt && nt.replace(/\D/g, '').startsWith(rows[rows.length - 1][0])) info.noticed = nt;
        render();
        addEventListener('resize', () => { if (document.getElementById('chart')) drawChart(); });
      } catch {
        document.getElementById('card').innerHTML = '<div class="err">환율 기록을 불러오지 못했어요.<br>잠시 후 다시 열어 주세요.</div>';
      }
    }
    load();
  </script>
</body>
</html>
