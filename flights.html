<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>베트남 출발 최저가 항공권</title>
  <meta name="theme-color" content="#eef6ff">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --canvas: #fff; --page: #f5f8fc; --surface: #eef2f7; --hairline: #e3e8ef;
      --ink: #1f1f1f; --slate: #5d5b54; --steel: #8a8580;
      --blue: #1c64d9; --blue-soft: #e8f0fe; --red: #c8102e; --green: #2f9e44;
      --font: Inter, -apple-system, system-ui, 'Segoe UI', 'Malgun Gothic', Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.55 var(--font); word-break: keep-all; }
    .wrap { max-width: 560px; margin: 0 auto; padding-bottom: 36px; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; font-size: 13px; color: var(--steel); }
    .top a { color: var(--slate); text-decoration: none; font-size: 14px; padding: 6px 0; }
    .demo { margin: 8px 16px 0; padding: 6px 10px; border-radius: 8px; background: #fff3bf; color: #7a5200; font-size: 12px; font-weight: 600; text-align: center; }

    /* 머리 */
    .hero { position: relative; margin: 10px 16px 0; border-radius: 20px; padding: 22px 20px 18px; overflow: hidden;
      background: linear-gradient(160deg, #eaf4ff 0%, #dbeafe 100%); }
    .hero-head { position: relative; z-index: 1; padding-right: 104px; }
    .hero h1 { margin: 0; font-size: 22px; letter-spacing: -.5px; line-height: 1.25; white-space: nowrap; }
    .hero h1 em { font-style: normal; color: var(--blue); }
    .hero p { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: var(--slate); letter-spacing: -.3px; }
    .hero svg.plane { position: absolute; right: 10px; top: 18px; width: 100px; height: 88px; }
    .plane .fly { animation: fly 3s ease-in-out infinite; }
    @keyframes fly { 50% { transform: translate(3px, -3px); } }
    @media (prefers-reduced-motion: reduce) { .plane .fly { animation: none; } }

    /* 고르기 */
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: rgba(255,255,255,.6); padding: 4px; border-radius: 12px; margin-top: 14px; }
    .seg button { border: 0; background: none; border-radius: 9px; padding: 8px 4px; font: 600 14px var(--font); color: var(--slate); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: rgba(15,15,15,.08) 0 1px 3px; }
    .seg small { display: block; font-size: 10.5px; font-weight: 600; color: var(--blue); line-height: 1.2; }
    .filters { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
    .pill { border: 1px solid #cfd8e3; background: #fff; border-radius: 9999px; padding: 5px 10px; font: 600 12.5px var(--font); color: var(--slate); cursor: pointer; }
    .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .sep { width: 1px; height: 18px; background: #cfd8e3; margin: 0 2px; }
    /* 날짜 고르기 */
    .dates { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: end; margin-top: 10px; }
    .dates label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--slate); }
    .dates input { width: 100%; height: 40px; border: 1px solid #cfd8e3; border-radius: 8px; background: #fff; padding: 0 8px; font: 500 14px var(--font); color: var(--ink); }
    .dates input:focus { outline: none; border: 2px solid var(--blue); padding: 0 7px; }
    .dates .tilde { padding-bottom: 10px; color: var(--steel); }
    .date-hint { margin: 6px 0 0 !important; font-size: 11.5px !important; color: var(--steel) !important; }
    /* 출처·안내 */
    .notice { display: flex; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface); font-size: 12.5px; line-height: 1.5; color: var(--slate); }
    .notice b { color: var(--ink); }
    .notice a { color: var(--blue); }
    .fl .alt { font-size: 11.5px; color: var(--steel); }

    /* 목록 */
    .card { background: var(--canvas); border-radius: 16px; margin: 12px 16px 0; padding: 16px; box-shadow: rgba(15,15,15,.04) 0 1px 2px; }
    .card h2 { margin: 0; font-size: 17px; letter-spacing: -.3px; }
    .card .meta { margin: 2px 0 0; font-size: 12.5px; color: var(--steel); }
    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .fl { border: 1px solid var(--hairline); border-radius: 14px; padding: 12px 14px; background: #fff; }
    .fl .air { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--slate); }
    .fl .logo { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; }
    .fl .route { margin-top: 4px; font-size: 15.5px; font-weight: 700; }
    .fl .route span { font-size: 12px; font-weight: 600; color: var(--steel); }
    .fl .price { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
    .fl .price b { font-size: 21px; letter-spacing: -.5px; }
    .fl .price small { font-size: 12.5px; color: var(--slate); }
    .fl .when { margin-top: 6px; font-size: 13px; }
    .fl .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .fl .ago { font-size: 11.5px; color: var(--steel); }
    .fl .go { font-size: 13px; font-weight: 700; color: #fff; background: var(--blue); border-radius: 8px; padding: 7px 12px; text-decoration: none; }
    .tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 9999px; background: var(--blue-soft); color: var(--blue); }
    .tag.soon { background: #fff0f0; color: var(--red); }
    .empty { font-size: 13.5px; color: var(--slate); padding: 10px 2px 0; }
    .src { margin: 14px 16px 0; font-size: 11.5px; color: var(--steel); text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><span>✈️ 항공권</span><a href="./" id="back" data-tab="life" data-self="flight">← 도우미로</a></div>

    <section class="hero">
      <svg class="plane" viewBox="0 0 100 88" aria-hidden="true">
        <circle cx="74" cy="20" r="11" fill="#ffd43b"/>
        <path d="M8 70 q10 -8 20 0 q10 -8 20 0" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M4 52 Q30 64 62 40" stroke="#9cc3f5" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
        <g class="fly">
          <path d="M44 46 L88 26 Q95 23 96 28 Q96 32 90 35 L52 54 Z" fill="#fff" stroke="#1c64d9" stroke-width="2" stroke-linejoin="round"/>
          <path d="M66 36 L60 18 L68 16 L78 32 Z" fill="#1c64d9"/>
          <path d="M60 48 L62 64 L70 62 L72 44 Z" fill="#1c64d9"/>
          <path d="M48 48 L42 40 L47 38 L54 45 Z" fill="#c8102e"/>
        </g>
      </svg>
      <div class="hero-head">
        <h1>베트남 출발 <em>최저가</em></h1>
        <p id="sub">항공권 검색 사이트에서 최근 검색된 가격 중 가장 싼 표예요. 하루 몇 번 새로 받아요.</p>
      </div>
      <div class="seg" id="from" role="group" aria-label="출발 공항"></div>
      <div class="filters">
        <button class="pill" data-trip="ow">편도</button><button class="pill" data-trip="rt">왕복</button>
        <span class="sep" aria-hidden="true"></span>
        <button class="pill" data-to="KR">한국행</button><button class="pill" data-to="ALL">전체</button>
        <span class="sep" aria-hidden="true"></span>
        <button class="pill" id="direct">직항만</button>
      </div>
      <div class="dates">
        <label><span id="d1-label">출발일</span><input type="date" id="d1"></label>
        <span class="tilde" aria-hidden="true">~</span>
        <label><span id="d2-label">도착일</span><input type="date" id="d2"></label>
      </div>
      <p class="date-hint" id="date-hint"></p>
    </section>

    <section class="card">
      <h2 id="list-title"></h2>
      <p class="meta" id="list-meta"></p>
      <div class="notice"><span aria-hidden="true">ℹ️</span><span><b>출처: <a href="https://www.aviasales.com/" target="_blank" rel="noopener">Aviasales</a></b> (Travelpayouts 가격 데이터).
        최근 검색된 가격이라 지금 가격과 다를 수 있어요. <b>정확한 가격·좌석은 ‘예약 사이트에서 확인’을 눌러 해당 사이트에서 확인하세요.</b></span></div>
      <div class="list" id="list"></div>
    </section>
    <p class="src">출처: Aviasales · Travelpayouts 가격 데이터 · <span id="src-time"></span><br>이 앱은 항공권을 팔지 않으며, 광고·제휴 링크가 없어요.</p>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const CITY = { HAN: '하노이', SGN: '호찌민', DAD: '다낭' };
    const KR = ['ICN', 'PUS', 'CJU', 'GMP', 'TAE', 'CJJ'];
    const AP = { ICN: '인천', GMP: '김포', PUS: '부산', CJU: '제주', TAE: '대구', CJJ: '청주', HAN: '하노이', SGN: '호찌민', DAD: '다낭',
      PQC: '푸꾸옥', CXR: '나트랑', DLI: '달랏', VCS: '꼰다오', VDH: '동허이', HPH: '하이퐁', HUI: '후에', VCA: '껀터', UIH: '꾸이년',
      BKK: '방콕', DMK: '방콕(돈므앙)', HKT: '푸껫', CNX: '치앙마이', SIN: '싱가포르', KUL: '쿠알라룸푸르', HKG: '홍콩', TPE: '타이베이', MNL: '마닐라',
      CEB: '세부', DPS: '발리', CGK: '자카르타', NRT: '도쿄(나리타)', HND: '도쿄(하네다)', KIX: '오사카', FUK: '후쿠오카', PVG: '상하이', PKX: '베이징',
      CAN: '광저우', SZX: '선전', MFM: '마카오', SYD: '시드니', MEL: '멜버른', DXB: '두바이', SVO: '모스크바', CMB: '콜롬보', TAS: '타슈켄트' };
    const AL = { VJ: ['비엣젯', '#e03131'], VZ: ['타이 비엣젯', '#e03131'], VN: ['베트남항공', '#0b7285'], QH: ['뱀부항공', '#2f9e44'], VU: ['비엣트래블', '#1971c2'],
      '7C': ['제주항공', '#e8590c'], TW: ['티웨이', '#c2255c'], BX: ['에어부산', '#1971c2'], LJ: ['진에어', '#2b8a3e'], KE: ['대한항공', '#1c64d9'],
      OZ: ['아시아나', '#862e9c'], RS: ['에어서울', '#0ca678'], ZE: ['이스타항공', '#d6336c'], '9G': ['썬피닉스', '#f08c00'], FD: ['타이 에어아시아', '#e03131'],
      AK: ['에어아시아', '#e03131'], UO: ['홍콩익스프레스', '#7048e8'], CZ: ['중국남방항공', '#1864ab'], MU: ['중국동방항공', '#1864ab'], TR: ['스쿠트', '#f59f00'] };
    let FL = [], KRW_PER_VND = 0.052, KRW_PER_USD = 1340, updated = '';
    let from = 'HAN', trip = 'ow', to = 'KR', direct = true;

    const usd = (n) => '$' + Math.round(n * KRW_PER_VND / KRW_PER_USD).toLocaleString('en-US');
    const krw = (n) => '약 ' + (Math.round(n * KRW_PER_VND / 1000) / 10).toLocaleString('ko-KR') + '만원';
    const dateOf = (s) => new Date(s.slice(0, 10) + 'T00:00:00');
    const day = (s) => { const d = dateOf(s); return `${d.getMonth() + 1}월 ${d.getDate()}일(${'일월화수목금토'[d.getDay()]})`; };
    const daysTo = (s) => Math.round((dateOf(s) - new Date(new Date().toDateString())) / 864e5);
    const hm = (m) => m ? `${Math.floor(m / 60)}시간${m % 60 ? ' ' + (m % 60) + '분' : ''}` : '';
    const gf = (r) => 'https://www.google.com/travel/flights?hl=ko&q=' + encodeURIComponent(
      `Flights from ${r.from} to ${r.to} on ${r.depart.slice(0, 10)}` + (r.trip === 'rt' ? ` returning ${r.return.slice(0, 10)}` : ' one way') + (r.transfers === 0 ? ' nonstop' : ''));
    // 가격 출처(Aviasales)의 같은 날짜 검색 화면: /search/{출발}{DDMM}{도착}[{돌아오는 DDMM}]1 (성인 1명) · 제휴 표시 없음
    const ddmm = (s) => s.slice(8, 10) + s.slice(5, 7);
    const avia = (r) => `https://www.aviasales.com/search/${r.from}${ddmm(r.depart)}${r.to}${r.trip === 'rt' && r.return ? ddmm(r.return) : ''}1`;
    const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    let d1 = '', d2 = ''; // 출발일 ~ 도착일 (YYYY-MM-DD)

    function render() {
      $('#from').innerHTML = Object.keys(CITY).map((k) =>
        `<button type="button" data-from="${k}" aria-pressed="${k === from}"><small>${k === 'HAN' ? '내 지역' : '&nbsp;'}</small>${CITY[k]}</button>`).join('');
      document.querySelectorAll('[data-trip]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.trip === trip));
      document.querySelectorAll('[data-to]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.to === to));
      $('#direct').setAttribute('aria-pressed', direct);

      // 날짜 구간: 편도는 출발일~도착일 사이에 출발, 왕복은 출발일 이후에 가서 도착일까지 돌아오는 표
      $('#date-hint').textContent = trip === 'ow'
        ? '고른 기간 사이에 출발하는 편도 항공편만 보여요.'
        : '출발일 이후에 가서 도착일까지 돌아오는 왕복 항공편만 보여요.';
      const inRange = (r) => r.depart.slice(0, 10) >= d1 && (trip === 'ow' ? r.depart.slice(0, 10) <= d2 : (r.return || '').slice(0, 10) <= d2);
      let rows = FL.filter((r) => r.from === from && r.trip === trip && daysTo(r.depart) >= 0 && inRange(r)
        && (to === 'ALL' || KR.includes(r.to)) && (!direct || (r.transfers === 0 && (trip === 'ow' || r.return_transfers === 0))));
      if (to === 'ALL') { // 전체: 목적지마다 가장 싼 1건씩 → 여러 나라가 보이게
        const best = {};
        rows.forEach((r) => { if (!best[r.to] || r.price < best[r.to].price) best[r.to] = r; });
        rows = Object.values(best);
      }
      rows.sort((a, b) => a.price - b.price);
      const shown = rows.slice(0, 20).sort((a, b) => a.depart.localeCompare(b.depart) || a.price - b.price); // 싼 20개를 출발 빠른 순으로
      $('#list-title').textContent = `${CITY[from]} 출발 · ${to === 'KR' ? '한국행' : '전체 목적지'} ${trip === 'ow' ? '편도' : '왕복'}`;
      $('#list-meta').textContent = `${rows.length}개 중 싼 ${shown.length}개 · 출발 빠른 순${direct ? ' · 직항만' : ''}${updated ? ` · ${updated} 기준` : ''}`;
      $('#list').innerHTML = shown.length ? shown.map((r) => {
        const [name, color] = AL[r.airline] || [r.airline, '#495057'], n = daysTo(r.depart);
        const nights = r.trip === 'rt' && r.return ? Math.round((dateOf(r.return) - dateOf(r.depart)) / 864e5) : 0;
        return `<div class="fl">
          <div class="air"><span class="logo" style="background:${color}">${r.airline}</span>${name} · ${r.transfers === 0 ? '직항' : r.transfers + '회 경유'}${r.duration ? ' · ' + hm(r.duration) : ''} ${n <= 7 ? `<span class="tag soon">${n === 0 ? '오늘' : n + '일 뒤'} 출발</span>` : ''}</div>
          <div class="route">${CITY[r.from]} <span>${r.from}</span> → ${AP[r.to] || r.to} <span>${r.to}</span></div>
          <div class="price"><b>${krw(r.price)}</b><small>${usd(r.price)} ·${r.trip === 'ow' ? '편도' : '왕복'} 1명</small></div>
          <div class="when">📅 ${day(r.depart)} ${r.depart.slice(11, 16)}${r.trip === 'rt' && r.return ? ` ~ ${day(r.return)} · ${nights}박 ${nights + 1}일` : ' 출발'}</div>
          <div class="row"><span class="ago">${r.flight ? r.airline + r.flight + '편 · ' : ''}<a class="alt" href="${gf(r)}" target="_blank" rel="noopener">구글 항공편</a></span><a class="go" href="${avia(r)}" target="_blank" rel="noopener">예약 사이트에서 확인 ›</a></div>
        </div>`;
      }).join('') : '<p class="empty">이 기간에 맞는 항공권이 아직 없어요. 날짜 범위를 넓히거나, 직항만을 끄거나, 다른 공항을 골라 보세요.</p>';
    }
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.from) from = b.dataset.from;
      else if (b.dataset.trip) trip = b.dataset.trip;
      else if (b.dataset.to) to = b.dataset.to;
      else if (b.id === 'direct') direct = !direct;
      else return;
      render();
    });
    // 날짜를 바꾸면 그 구간에 해당하는 항공편만 다시 보여줘요 (출발일이 도착일보다 늦으면 도착일을 맞춰요)
    document.addEventListener('change', (e) => {
      if (e.target.id !== 'd1' && e.target.id !== 'd2') return;
      d1 = $('#d1').value || d1; d2 = $('#d2').value || d2;
      if (d1 > d2) { if (e.target.id === 'd1') d2 = d1; else d1 = d2; $('#d1').value = d1; $('#d2').value = d2; }
      $('#d2').min = d1;
      render();
    });
    function setupDates() {
      // 기본: 오늘 ~ 받아 온 데이터의 마지막 날짜 (고를 수 있는 범위도 그 안으로)
      const last = FL.reduce((m, r) => [m, r.depart.slice(0, 10), (r.return || '').slice(0, 10)].sort().pop(), iso(new Date()));
      d1 = iso(new Date()); d2 = last;
      for (const id of ['d1', 'd2']) { const el = $('#' + id); el.min = d1; el.max = last; }
      $('#d1').value = d1; $('#d2').value = d2;
    }
    (async () => {
      try {
        const m = await (await fetch('market.json?t=' + Date.now(), { cache: 'no-store' })).json();
        const v = (m.rates?.items || []).find((x) => x.code === 'VND');
        if (v && v.value && v.unit) KRW_PER_VND = v.value / v.unit; // 100동 = 5.2원 → 1동 = 0.052원
        const u = (m.rates?.items || []).find((x) => x.code === 'USD');
        if (u && u.value && u.unit) KRW_PER_USD = u.value / u.unit;
      } catch {}
      try {
        const d = await (await fetch('flights.json?t=' + Date.now(), { cache: 'no-store' })).json();
        FL = d.flights || []; updated = (d.updated || '').slice(5).replace('-', '/');
      } catch {}
      $('#src-time').textContent = updated ? `${updated} 받아 옴` : '';
      setupDates();
      render();
    })();
  </script>
  <script src="back.js"></script>
</body>
</html>
